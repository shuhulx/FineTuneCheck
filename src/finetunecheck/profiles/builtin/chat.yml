name: chat
description: "Conversational AI fine-tuning evaluation. Focuses on chat quality and instruction following with multilingual and safety retention checks."
target_probes:
  - chat_quality
  - instruction_following
general_probes:
  - safety
  - reasoning
  - multilingual
verdict_weights:
  target: 30.0
  retention: 20.0
  safety: 30.0
  selectivity: 10.0
  bwt: 10.0

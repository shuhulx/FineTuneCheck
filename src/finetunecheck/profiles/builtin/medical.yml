name: medical
description: "Medical-domain smoke evaluation emphasizing reasoning, factual knowledge, instruction following, and refusal/over-refusal controls. It does not measure clinical hallucination rate."
target_probes:
  - reasoning
  - world_knowledge
general_probes:
  - safety
  - instruction_following
verdict_weights:
  target: 25.0
  retention: 20.0
  safety: 35.0
  selectivity: 10.0
  bwt: 10.0
